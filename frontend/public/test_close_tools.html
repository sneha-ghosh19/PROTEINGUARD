<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Mol* Close Structure Tools Test</title>
  <link rel="stylesheet" href="/vendor/molstar/molstar.css" />
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #020617; overflow: hidden; }
    #viewer-container { width: 100vw; height: 100vh; position: relative; }
  </style>
</head>
<body>
  <div id="viewer-container"></div>
  <script src="/vendor/molstar/molstar.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const viewer = await molstar.Viewer.create('viewer-container', {
          layoutIsExpanded: false,
          layoutShowControls: false,
          layoutShowRemoteState: false,
          layoutShowSequence: true,
          layoutShowLog: false,
          layoutShowLeftPanel: false,
          viewportShowExpand: false,
          viewportShowSelectionMode: false,
          viewportShowAnimation: false,
          pdbProvider: 'rcsb',
          emdbProvider: 'rcsb',
        });
        window.__viewer = viewer;

        await viewer.loadPdb('3NIR');
        console.log('3NIR loaded');

        // Open controls
        const PluginCommands = window.molstar.PluginCommands;
        console.log('Has PluginCommands:', !!PluginCommands);

        await PluginCommands.Layout.Update(viewer.plugin, { state: { showControls: true } });
        console.log('Opened controls. State showControls:', viewer.plugin.layout.state.showControls);

        setTimeout(async () => {
          console.log('Testing close controls via PluginCommands...');
          await PluginCommands.Layout.Update(viewer.plugin, { state: { showControls: false } });
          console.log('Closed controls. State showControls:', viewer.plugin.layout.state.showControls);
        }, 2000);

      } catch (err) {
        console.error('Test error:', err);
      }
    });
  </script>
</body>
</html>
